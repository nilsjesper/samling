project_name: samling

builds:
  - main: .
    ldflags:
      - -s
      - -w
      - -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - format: tar.gz
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "{{.ProjectName}}_{{.Version}}_checksums.txt"
  algorithm: sha256

brews:
  - name: samling
    repository:
      owner: nilsjesper
      name: homebrew-tap
      token: "{{.Env.HOMEBREW_TAP_TOKEN}}"
    commit_author:
      name: goreleaser
      email: goreleaser@users.noreply.github.com
    description: "Shuffle your way through an Instapaper backlog"
    homepage: "https://github.com/nilsjesper/samling"
    license: "MIT"
    install: |
      bin.install "samling"